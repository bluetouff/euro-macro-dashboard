# /etc/apache2/sites-available/euromacro.conf
#
# Vhost Apache pour le site statique Euro Macro Risk.
# Sert UNIQUEMENT le dossier statique en lecture seule, avec en-têtes de sécurité.
# Le bloc HTTPS est ajouté automatiquement par certbot (voir le tuto).

<VirtualHost *:80>
    ServerName  euromacro.example.com
    DocumentRoot /var/www/html/euromacro

    <Directory /var/www/html/euromacro>
        # Pas de listing de répertoire, pas d'exécution de scripts, pas de .htaccess
        Options -Indexes -ExecCGI -Includes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Refuse l'accès aux fichiers sensibles éventuels
    <FilesMatch "\.(py|sh|json5|env|service|timer|md)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # En-têtes de sécurité (module headers requis : a2enmod headers)
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

    # Cache : l'instantané change 1×/jour, le reste est stable
    <FilesMatch "snapshot\.(js|json)$">
        Header set Cache-Control "public, max-age=1800"
    </FilesMatch>
    <FilesMatch "\.(html)$">
        Header set Cache-Control "public, max-age=300"
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/euromacro_error.log
    CustomLog ${APACHE_LOG_DIR}/euromacro_access.log combined
</VirtualHost>
