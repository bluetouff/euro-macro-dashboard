name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production dependencies
        run: python -m pip install -r requirements-prod.txt
      - name: Validate dependencies
        run: python -m pip check
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Static syntax checks
        run: |
          python -m compileall -q app.py build_snapshot.py catalog.py data.py snapshot_contract.py validate_snapshot.py
          bash -n deploy/refresh.sh
