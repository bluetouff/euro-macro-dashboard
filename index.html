<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Euro Macro Risk</title>
<style>
  :root{
    --bg:#0a0a0c; --panel:#131316; --panel2:#17171b; --line:#23232a;
    --txt:#e9e9ec; --mut:#7c7c86; --accent:#f5a623;
    --ok:#2fbf71; --warn:#f5a623; --dang:#ff4d4f;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--txt);margin:0;padding:26px 28px 40px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;max-width:1500px;margin:0 auto;}
  a{color:var(--accent);}
  .title{font-size:24px;font-weight:800;margin:0;}
  .sub{color:var(--mut);font-size:12px;margin-top:3px;}
  .hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:16px 0 6px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .stat .lab{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;}
  .stat .big{font-size:34px;font-weight:800;font-family:ui-monospace,'SF Mono',monospace;line-height:1.1;margin-top:2px;}
  .stat .big small{font-size:14px;color:var(--mut);font-weight:600;}
  .pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;margin-top:6px;}
  .dots{font-size:13px;font-family:ui-monospace,'SF Mono',monospace;margin-top:10px;color:var(--mut);}
  details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 14px;margin:10px 0;}
  details summary{cursor:pointer;padding:11px 0;font-size:13px;font-weight:600;color:#cfcfd6;list-style:none;}
  details summary::-webkit-details-marker{display:none;}
  details summary::before{content:'▸ ';color:var(--mut);}
  details[open] summary::before{content:'▾ ';}
  details .body{padding:4px 0 14px;font-size:12.5px;line-height:1.6;color:#c4c4cc;}
  .sec{display:flex;align-items:center;gap:10px;margin:20px 0 10px;}
  .sec .ic{font-size:15px;}
  .sec .nm{font-size:13px;font-weight:700;color:#cfcfd6;text-transform:uppercase;letter-spacing:.06em;}
  .sec .ln{flex:1;height:1px;background:var(--line);}
  .sec .bd{font-family:ui-monospace,'SF Mono',monospace;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:9px;}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 13px 9px;position:relative;overflow:hidden;transition:.15s;}
  .tile:hover{border-color:#34343d;background:var(--panel2);}
  .tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);}
  .tile .nm{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;line-height:1.25;min-height:25px;display:flex;gap:5px;}
  .tile .nm .d{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none;margin-top:3px;}
  .tile .vl{font-size:21px;font-weight:700;font-family:ui-monospace,'SF Mono',monospace;color:#fff;line-height:1.1;margin-top:5px;}
  .tile .vl u{font-size:11px;color:var(--mut);font-weight:600;text-decoration:none;margin-left:3px;}
  .tile .mt{font-size:10px;font-family:ui-monospace,'SF Mono',monospace;color:var(--mut);margin-top:4px;}
  .tile .mt b{font-weight:700;}
  .tile svg.spark{display:block;width:100%;height:26px;margin-top:6px;}
  .alerts{display:flex;flex-wrap:wrap;gap:7px;}
  .al{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:9px;padding:7px 11px;}
  .al .an{font-size:11px;color:#d7d7dc;font-weight:600;}
  .al .av{font-family:ui-monospace,'SF Mono',monospace;font-size:12px;font-weight:700;}
  .muted{color:var(--mut);font-size:11px;}
  .ok-banner{background:#10301f;border:1px solid #1d5236;color:#5fd99a;border-radius:9px;padding:10px 14px;font-size:13px;}
  @media (max-width:640px){
    body{padding:16px 14px 30px;}
    .title{font-size:20px;}
    .stat .big{font-size:28px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;}
  }
</style>
</head>
<body>
<div id="app"><p class="muted">Chargement de l'instantané…</p></div>

<script src="snapshot.js"></script>
<script>
(function(){
  const S = window.SNAPSHOT;
  const app = document.getElementById('app');
  if(!S){ app.innerHTML = "<p class='muted'>Aucun instantané trouvé. Lancez "+
    "<code>python build_snapshot.py</code> pour générer <code>snapshot.js</code>.</p>"; return; }

  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  function fmt(v){
    if(v===null||v===undefined) return '—';
    const a=Math.abs(v);
    if(a>=1000) return v.toLocaleString('fr-FR',{maximumFractionDigits:0});
    if(a>=1)    return v.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
    return v.toLocaleString('fr-FR',{minimumFractionDigits:3,maximumFractionDigits:3});
  }
  const emoji = {ok:'🟢',warning:'🟡',danger:'🔴',unknown:'⚪'};

  function sparkSVG(arr,color){
    if(!arr||arr.length<2) return '';
    const w=100,h=26,n=arr.length;
    const mn=Math.min(...arr),mx=Math.max(...arr),rg=(mx-mn)||1;
    const pts=arr.map((v,i)=>{
      const x=(i/(n-1))*w, y=h-2-((v-mn)/rg)*(h-4);
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    return "<svg class='spark' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none'>"+
      "<polyline fill='none' stroke='"+color+"' stroke-width='1.5' points='"+pts+"'/></svg>";
  }

  // ---------- HERO ----------
  const c=S.counts, r=S.regime;
  let html =
    "<div class='title'>🇪🇺 Euro Macro Risk</div>"+
    "<div class='sub'>BCE + Eurostat · "+c.total+" indicateurs · MAJ "+esc(S.generated_at)+
      " · backtest récessions CEPR</div>"+
    "<div class='hero'>"+
      "<div class='stat'><div class='lab'>Score de risque global</div>"+
        "<div class='big' style='color:"+r.color+"'>"+fmt(S.global_score)+"<small>/100</small></div></div>"+
      "<div class='stat'><div class='lab'>Régime macro</div>"+
        "<span class='pill' style='background:"+r.color+"22;color:"+r.color+";border:1px solid "+r.color+"55'>"+
        esc(r.label)+"</span></div>"+
      "<div class='stat'><div class='lab'>CISS · stress systémique BCE</div>"+
        (S.ciss?("<div class='big' style='color:"+statusColor(S.ciss.status)+"'>"+fmt(S.ciss.value)+" "+emoji[S.ciss.status]+"</div>"):"<div class='muted'>n/d</div>")+"</div>"+
      "<div class='stat'><div class='lab'>État des "+c.total+" indicateurs</div>"+
        "<div class='dots'>🟢 "+c.ok+"&nbsp;&nbsp;🟡 "+c.warn+"&nbsp;&nbsp;🔴 "+c.dang+"</div></div>"+
    "</div>";

  // ---------- LÉGENDE ----------
  html +=
    "<details><summary>ℹ️ Comment lire ce tableau de bord</summary><div class='body'>"+
    "<b>Score global 0-100</b> — agrégation pondérée par pouvoir prédictif (corrélation historique "+
    "aux récessions CEPR). 🟩 &lt;45 Risk-On · ⬜ 45-55 Neutre · 🟧 55-70 Prudence · 🟥 &gt;70 Stress.<br>"+
    "<b>Couleur d'un indicateur</b> = z-score signé (écart à sa moyenne 5 ans, orienté risque) : "+
    "🟢 normal · 🟡 tension (|z|≥1) · 🔴 alerte (|z|≥2). <code>z</code> = z-score · <code>1A</code> = variation sur 1 an.<br>"+
    "<b>⏰ Signaux avancés</b> = indicateurs qui précèdent le cycle (pente de courbe, M1 réel, M3, "+
    "anticipations d'emploi). Le PMI étant propriétaire, on utilise l'ESI (Commission/Eurostat).<br>"+
    "<span class='muted'>Sources publiques BCE + Eurostat · CISS © BCE · récessions CEPR-EABCN.</span>"+
    "</div></details>";

  // ---------- ALERTES ----------
  html += "<div class='sec'><span class='ic'>⚠️</span><span class='nm'>Signaux d'alerte</span><span class='ln'></span></div>";
  if(S.alerts && S.alerts.length){
    html += "<div class='alerts'>";
    S.alerts.forEach(a=>{
      html += "<div class='al' style='--c:"+a.color+"'>"+emoji[a.status]+
        "<span class='an'>"+esc(a.name)+"</span>"+
        "<span class='av' style='color:"+a.color+"'>"+fmt(a.value)+" · z"+sgn(a.z)+"</span></div>";
    });
    html += "</div>";
  } else {
    html += "<div class='ok-banner'>✓ Aucun signal d'alerte — tous les indicateurs sont dans leur zone normale.</div>";
  }

  // ---------- HISTORIQUE ----------
  html += "<details><summary>📈 Score composite historique vs récessions (CEPR)</summary><div class='body'>"+
          histChart()+"<div class='muted'>Zones rouges = récessions CEPR. Un score &gt;55 avant/pendant "+
          "ces zones valide le pouvoir d'alerte du composite.</div></div></details>";

  // ---------- FAMILLES ----------
  S.families.forEach(f=>{
    html += "<div class='sec'><span class='ic'>"+f.icon+"</span><span class='nm'>"+esc(f.label)+
      "</span><span class='ln'></span><span class='bd' style='background:"+f.color+"22;color:"+f.color+
      "'>"+fmt(f.score)+"</span></div><div class='grid'>";
    f.indicators.forEach(d=>{
      let mt = (d.z!==null? "<b style='color:"+d.color+"'>z "+sgn(d.z)+"</b>":"");
      if(d.mom_1y!==null) mt += " · 1A "+sgn(d.mom_1y,0)+"%";
      html += "<div class='tile' style='--c:"+d.color+"'>"+
        "<div class='nm'><span class='d'></span>"+esc(d.name)+"</div>"+
        "<div class='vl'>"+fmt(d.value)+(d.unit?"<u>"+esc(d.unit)+"</u>":"")+"</div>"+
        "<div class='mt'>"+mt+"</div>"+
        sparkSVG(d.spark,d.color)+"</div>";
    });
    html += "</div>";
  });

  // ---------- DIAGNOSTIC ----------
  let diag = "<b>Indicateurs actifs :</b> "+c.total+" affichés ("+S.catalog_total+" au catalogue)<br>";
  const errs = S.errors||{};
  const ek = Object.keys(errs);
  if(ek.length){ diag += "<b>Séries ignorées :</b><br>"; ek.forEach(k=>diag+="• <code>"+esc(k)+"</code> — "+esc(errs[k])+"<br>"); }
  else { diag += "<span style='color:#5fd99a'>Toutes les séries du catalogue ont été récupérées.</span><br>"; }
  diag += "<span class='muted'>© European Central Bank (ECB Data Portal) &amp; Eurostat · CISS © ECB · récessions CEPR-EABCN.</span>";
  html += "<details><summary>⚙️ Diagnostic des sources</summary><div class='body'>"+diag+"</div></details>";

  app.innerHTML = html;

  // ---------- helpers ----------
  function sgn(v,dec){ if(v===null||v===undefined) return '—';
    dec = (dec===undefined?2:dec); return (v>=0?'+':'')+v.toFixed(dec); }
  function statusColor(s){ return {ok:'#2fbf71',warning:'#f5a623',danger:'#ff4d4f'}[s]||'#777'; }
  function histChart(){
    const H=S.history; if(!H||H.length<12) return "<span class='muted'>Historique insuffisant.</span>";
    const W=1000,Ht=240,pad=4;
    const ym = H.map(p=>p[0]);
    const idxOf = d => { const k=d.slice(0,7); let b=0,bd=1e9;
      ym.forEach((m,i)=>{const diff=Math.abs(monthNum(m)-monthNum(k)); if(diff<bd){bd=diff;b=i;}}); return b; };
    const x = i => pad + (i/(H.length-1))*(W-2*pad);
    const y = v => Ht-pad - (v/100)*(Ht-2*pad);
    let svg = "<svg viewBox='0 0 "+W+" "+Ht+"' preserveAspectRatio='none' style='width:100%;height:240px;background:#0e0e11;border-radius:8px'>";
    // recession bands
    (S.recessions||[]).forEach(p=>{
      const x0=x(idxOf(p[0])), x1=x(idxOf(p[1]));
      svg += "<rect x='"+x0.toFixed(1)+"' y='0' width='"+Math.max(1,(x1-x0)).toFixed(1)+"' height='"+Ht+"' fill='#ff4d4f' opacity='0.15'/>";
    });
    // threshold 55
    svg += "<line x1='0' y1='"+y(55).toFixed(1)+"' x2='"+W+"' y2='"+y(55).toFixed(1)+"' stroke='#666' stroke-width='1' stroke-dasharray='4 4'/>";
    // line
    const pts = H.map((p,i)=> x(i).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ');
    svg += "<polyline fill='none' stroke='#f5a623' stroke-width='2' points='"+pts+"'/>";
    svg += "</svg>";
    return svg;
  }
  function monthNum(ym){ const a=ym.split('-'); return parseInt(a[0])*12+parseInt(a[1]||1); }
})();
</script>
</body>
</html>
