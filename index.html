<style>
  :root{
    color-scheme:dark;
    --bg:#0c0d10; --panel:#121419; --panel2:#171a20;
    --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.20);

  }
  *{box-sizing:border-box;}
  html{background:var(--bg);scroll-padding-top:24px;}
  body{background:radial-gradient(ellipse at 50% 0,rgba(94,234,212,.035),transparent 600px),var(--bg);

  body::before{content:"";display:block;height:2px;

  .wrap{max-width:1152px;margin:0 auto;padding:28px 24px 56px;}
  ::selection{background:var(--teal);color:var(--bg);}
  a{color:var(--teal);text-decoration:none;text-underline-offset:4px;}

  .home-link{display:inline-flex;align-items:center;justify-content:center;gap:12px;flex:none;min-height:44px;
    border:1px solid var(--line-soft);border-radius:8px;padding:9px 14px;color:var(--txt);font-size:12px;text-decoration:none;}
  .home-link span{color:var(--teal);}

  .tape{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:36px;}
  .top-nav{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;}
  .nav-link{display:inline-flex;align-items:center;min-height:44px;color:var(--mut);padding:10px 0;font-size:11px;}
  .nav-link:hover{color:var(--bright);}
  .nav-link.active{color:var(--teal);font-weight:600;}
  .page-heading{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px;}
  .page-intro{flex:1 1 480px;min-width:0;}
  .status-pill{max-width:100%;color:var(--mut);font-size:10px;line-height:1.7;display:flex;gap:10px;
    align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere;}
  .status-dot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--accent);}
  .status-pill.needs-attention .status-dot{background:var(--gold);}
  .eyebrow{color:var(--teal);font-size:10px;letter-spacing:.10em;text-transform:uppercase;margin:0 0 10px;}
  .title{font-size:clamp(27px,4vw,40px);font-weight:700;line-height:1.25;letter-spacing:-.05em;margin:0;color:var(--bright);}

  .hero{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);

  .sec .bd{font-family:var(--mono);font-size:12px;font-weight:600;padding:2px 9px;border-radius:5px;font-variant-numeric:tabular-nums;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  .tile{min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:16px;position:relative;overflow:hidden;transition:border-color .15s;}

  .tile .nm .d{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none;margin-top:3px;}
  .tile .vl{font-size:25px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em;color:var(--bright);line-height:1.25;margin-top:10px;}
  .tile .vl u{font-size:11px;color:var(--mut);font-weight:600;text-decoration:none;margin-left:3px;}
  .tile .mt{font-size:11px;font-family:var(--mono);color:var(--mut);margin-top:6px;}
  .tile .mt b{font-weight:700;}
  .tile svg.spark{display:block;width:100%;height:26px;margin-top:12px;}
  .alerts{display:flex;flex-wrap:wrap;gap:7px;}
  .al{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:9px 11px;}
  .al .an{font-size:11px;color:var(--paper);font-weight:600;}
  .al .av{font-family:ui-monospace,'SF Mono',monospace;font-size:12px;font-weight:700;}
  .muted{color:var(--mut);font-size:11px;}
  .ok-banner{background:rgba(94,234,212,.06);border:1px solid var(--line);color:var(--teal);border-radius:8px;padding:10px 14px;font-size:13px;}
  .quality-banner{background:rgba(245,177,61,.08);border:1px solid rgba(245,177,61,.42);color:var(--gold);border-radius:8px;padding:10px 14px;font-size:12px;margin:12px 0;}
  .asof{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;margin-top:8px;color:var(--mut);font-size:10px;}
  .asof a{color:var(--mut);text-decoration:none;}
  .asof a:hover{color:var(--teal);}
  .help-card{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--teal);
    border-radius:12px;padding:22px;color:var(--mut);font-size:12px;line-height:1.8;margin:0 0 20px;}
  .help-card strong{color:var(--paper);}
  .faq-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:0 0 20px;}
  .faq-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:22px;min-height:128px;color:var(--mut);font-size:12px;line-height:1.8;}
  .faq-card strong{color:var(--paper);display:block;margin-bottom:6px;}
  .site-footer{margin-top:32px;padding-top:24px;border-top:1px solid var(--line);color:var(--mut);font-size:11px;line-height:1.8;}
  .site-footer .brand-mark{font-size:28px;}
  .footer-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px;}
  .footer-nav{display:flex;flex-wrap:wrap;gap:10px 20px;}
  .footer-nav a{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;}
  .footer-nav a:hover{text-decoration:underline;text-underline-offset:4px;}
  .footer-note{margin:16px 0 0;line-height:1.8;}
  .chart-shell svg{display:block;border:1px solid var(--line);}
  @media (max-width:960px){.hero{grid-template-columns:repeat(2,minmax(0,1fr));}.brand-tag{display:none;}}
  @media (max-width:640px){
    .wrap{padding:22px 16px 40px;}
    .masthead{gap:12px;padding-bottom:20px;}
    .brand-mark{font-size:36px;}
    .home-link{font-size:11px;padding:9px 12px;}
    .stat .big{font-size:25px;}
    .hero{grid-template-columns:repeat(2,minmax(0,1fr));}
    .stat{min-height:120px;padding:16px 12px;}
    .stat .lab{font-size:9px;}
    .faq-grid{grid-template-columns:1fr;}
    .family-card,.alert-card,.help-card,.faq-card{padding:18px 16px;}
    details{padding:0 16px;}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
    .tile{padding:12px 11px 10px;}
    .tile .vl{font-size:21px;}
    .tile .nm{min-height:46px;overflow-wrap:anywhere;}
    .top-nav{gap:4px 18px;}
    .tape{margin-bottom:28px;}
    .sec .ln{min-width:8px;}
    .sec .bd{flex:none;}
  }
  @media (max-width:360px){.hero,.grid{grid-template-columns:1fr;}.tile .nm{min-height:0;}}
  @media (prefers-reduced-motion:reduce){.tile{transition:none;}}
</style>

<script src="snapshot.js"></script>
<script>
(function(){
  const S = window.SNAPSHOT;
  const app = document.getElementById('app');
  if(!S){ app.innerHTML = "<h1 class='title'>Euro Macro Risk</h1><p class='quality-banner' role='status'>L’instantané est indisponible. Vous pouvez consulter les <a href='https://l0g.fr/maintenant/'>signaux et leurs dates sur l0g.fr</a>.</p>"; return; }

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function fmt(v){
    if(v===null||v===undefined) return 'n/a';
    const a=Math.abs(v);
    if(a>=1000) return v.toLocaleString('fr-FR',{maximumFractionDigits:0});
    if(a>=1)    return v.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
    return v.toLocaleString('fr-FR',{minimumFractionDigits:3,maximumFractionDigits:3});
  }
  const params = new URLSearchParams(window.location.search);
  const view = ['faq','help','aide'].includes((params.get('view')||'').toLowerCase()) ? 'faq' : 'radar';

  function updateFreshness(){
    const age = (Date.now()-Date.parse(S.generated_at))/3600000;
    let message = '';
    if(!Number.isFinite(age) || age < -5/60){
      message = "Date de mise à jour invalide : fraîcheur non vérifiable.";
    } else if(age > 36){
      message = "Instantané périmé (plus de 36 h). Les scores ci-dessous sont historiques, pas un état courant.";
    } else if(age > 26){
      message = "Mise à jour quotidienne en retard (plus de 26 h). Le dernier instantané reste affiché ; son état de collecte ne décrit pas le service actuel.";
    }
    const banner = document.getElementById('snapshot-freshness');
    banner.textContent = message;
    banner.hidden = !message;
    document.getElementById('snapshot-status').classList.toggle('needs-attention',
      Boolean(message) || !S.quality || S.quality.status!=='ok');
  }

  function watchFreshness(){
    updateFreshness();
    setInterval(updateFreshness, 60000);
  }

  function header(){
    const radar = view === 'radar' ? 'active' : '';
    const faq = view === 'faq' ? 'active' : '';
    return "<div class='tape'>"+
      "<nav class='top-nav' aria-label='Navigation Euro Macro'>"+
        "<a class='nav-link "+radar+"'"+(radar?" aria-current='page'":"")+" href='?'>Radar Euro</a>"+
        "<a class='nav-link "+faq+"'"+(faq?" aria-current='page'":"")+" href='?view=faq'>Aide / FAQ</a>"+
      "</nav>"+
    "</div><div id='snapshot-freshness' class='quality-banner' role='status' hidden></div>";
  }

  function footer(){
    return "<footer class='site-footer'><div class='footer-top'>"+
      "<a class='brand' href='https://l0g.fr/' aria-label='l0g, accueil'><span class='brand-mark' aria-hidden='true'>l<span class='brand-zero'>0</span>g<span class='brand-cursor'>_</span></span></a>"+
      "<nav class='footer-nav' aria-label='Explorer l0g'>"+
        "<a href='https://l0g.fr/'>Analyses l0g.fr ↗</a>"+
        "<a href='https://l0g.fr/maintenant/#signal-eu'>Tous les signaux</a>"+
        "<a href='https://l0g.fr/methodologie/'>Méthodologie l0g</a>"+
      "</nav></div><p class='footer-note'>Euro Macro Risk · un outil de l0g · sources publiques, dates et limites visibles.<br>Information uniquement, aucun conseil d’investissement. MIT License · révision "+esc((S.source_sha||'n/a').slice(0,12))+"</p></footer>";
  }

  function faqPage(){
    return header()+
      "<div class='page-heading'><div class='page-intro'><div class='eyebrow'>// l0g · méthode &amp; sources</div><h1 class='title'>Aide / <span class='title-accent'>FAQ</span></h1></div>"+
      "<div id='snapshot-status' class='status-pill'><span class='status-dot' aria-hidden='true'></span>Collecte · "+esc(S.generated_at)+"</div></div>"+
      "<div class='help-card'><strong>Objectif.</strong> Euro Macro Risk agrège des séries publiques BCE et Eurostat pour surveiller le régime macro de la zone euro. L'outil ne prédit pas une récession et ne donne pas de conseil d'investissement : il aide à savoir quels canaux lire en premier.</div>"+
      "<div class='faq-grid'>"+
        "<div class='faq-card'><strong>Périmètre</strong> Le dashboard suit la composition courante de la zone euro, soit EA21 depuis le 1er janvier 2026. L'agrégat Eurostat évolutif EA n'est utilisé que lorsque le jeu de données le définit ainsi.</div>"+
        "<div class='faq-card'><strong>Score 0-100</strong> Le score combine les indicateurs disponibles avec une pondération heuristique fondée sur leur corrélation historique avec l'état de récession CEPR six mois plus tard. Ce n'est pas une validation prospective.</div>"+
        "<div class='faq-card'><strong>Sources</strong> Les données viennent de sources publiques et gratuites : ECB Data Portal, Eurostat, DG ECFIN pour l'EEI et datation CEPR-EABCN pour les récessions de la zone euro.</div>"+
        "<div class='faq-card'><strong>Lecture</strong> Le score global compte moins que sa composition : il faut regarder si la tension vient des taux, du souverain, du crédit, de l'activité réelle ou du stress systémique.</div>"+
      "</div>"+
      "<details open><summary>Que mesure exactement le radar ?</summary><div class='body'>Chaque série est comparée à son régime récent via un z-score orienté risque. Une valeur élevée n'est pas toujours un risque : certaines séries deviennent risquées quand elles baissent, comme la pente de courbe ou la monnaie réelle.</div></details>"+
      "<details><summary>Pourquoi remplacer le PMI ?</summary><div class='body'>Le PMI est propriétaire. Le dashboard utilise donc l'ESI et d'autres séries Eurostat ou BCE qui sont publiques, vérifiables et réutilisables sans clé.</div></details>"+
      "<details><summary>Comment lire les couleurs ?</summary><div class='body'>Vert signifie zone normale, jaune tension et rouge alerte, selon l'écart à la moyenne mobile 5 ans dans le sens du risque. La couleur est un signal de tri, pas une conclusion macro définitive.</div></details>"+
      "<details><summary>Quelles limites garder en tête ?</summary><div class='body'>Certaines séries sont révisées, publiées avec retard ou indisponibles temporairement. Le diagnostic liste les séries ignorées afin de garder une lecture transparente.</div></details>"+
      footer();
  }

  if(view === 'faq'){
    app.innerHTML = faqPage();
    watchFreshness();
    return;
  }

  function sparkSVG(arr,color){
    if(!arr||arr.length<2) return '';
    const w=100,h=26,n=arr.length;
    const mn=Math.min(...arr),mx=Math.max(...arr),rg=(mx-mn)||1;
    const pts=arr.map((v,i)=>{
      const x=(i/(n-1))*w, y=h-2-((v-mn)/rg)*(h-4);
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    return "<svg class='spark' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none'>"+
      "<polyline fill='none' stroke='"+color+"' stroke-width='1.5' points='"+pts+"'/></svg>";
  }

  // ---------- HERO ----------
  const c=S.counts, r=S.regime;
  const regimeColor = scoreColor(S.global_score);
  let html = header()+
    "<div class='page-heading'><div class='page-intro'><div class='eyebrow'>// l0g · radar macro · zone euro</div>"+
    "<h1 class='title'>Euro Macro <span class='title-accent'>Risk</span></h1>"+
    "<p class='intro'>Suivre les tensions de la zone euro, des taux à l’activité réelle. Chaque indicateur garde sa date et son lien vers la source.</p>"+
    "<div class='sub'>"+esc(S.scope||'Zone euro · composition courante')+" · "+c.total+" indicateurs · BCE / Eurostat / DG ECFIN · récessions CEPR</div></div>"+
    "<div id='snapshot-status' class='status-pill'><span class='status-dot' aria-hidden='true'></span>Collecte · "+esc(S.generated_at)+"</div></div>"+
    "<div class='hero'>"+
      "<div class='stat' style='border-top-color:"+regimeColor+"'><div class='lab'>Score de risque global</div>"+
        "<div class='big' style='color:"+regimeColor+"'>"+fmt(S.global_score)+"<small>/100</small></div></div>"+
      "<div class='stat' style='border-top-color:"+regimeColor+"'><div class='lab'>Régime macro</div>"+
        "<span class='pill' style='background:"+regimeColor+"22;color:"+regimeColor+";border:1px solid "+regimeColor+"55'>"+
        esc(r.label)+"</span></div>"+
      "<div class='stat' style='border-top-color:"+(S.ciss?statusColor(S.ciss.status):'var(--faint)')+"'><div class='lab'>New CISS · stress systémique BCE</div>"+
        (S.ciss?("<div class='big' style='color:"+statusColor(S.ciss.status)+"'>"+fmt(S.ciss.value)+"</div><div class='reading-status' style='color:"+statusColor(S.ciss.status)+"'>"+statusLabel(S.ciss.status)+"</div>"):"<div class='muted'>n/d</div>")+"</div>"+
      "<div class='stat' style='border-top-color:var(--teal)'><div class='lab'>État des "+c.total+" indicateurs</div>"+
        "<div class='dots'><span><b style='color:var(--ok)'>"+c.ok+"</b> normaux</span><span><b style='color:var(--warn)'>"+c.warn+"</b> en tension</span><span><b style='color:var(--dang)'>"+c.dang+"</b> en alerte</span></div></div>"+
    "</div>";

  if(S.quality && S.quality.status!=='ok'){
    html += "<div class='quality-banner'>Données dégradées : "+S.quality.active+"/"+S.quality.expected+
      " indicateurs actifs. Les séries absentes ou périmées sont exclues du score et détaillées dans le diagnostic.</div>";
  }

  // ---------- LÉGENDE ----------
  html +=
    "<details><summary>Comment lire ce tableau de bord</summary><div class='body'>"+
    "<b>Score global 0-100</b> : agrégation à pondération heuristique (corrélation historique "+
    "avec l'état de récession CEPR à +6 mois, sans validation hors échantillon). 🟩 &lt;45 Risk-On · ⬜ 45-55 Neutre · 🟧 55-70 Prudence · 🟥 &gt;70 Stress.<br>"+
    "<b>Couleur d'un indicateur</b> = z-score signé (écart à sa moyenne 5 ans, orienté risque) : "+
    "🟢 normal · 🟡 tension (|z|≥1) · 🔴 alerte (|z|≥2). <code>z</code> = z-score · <code>1A</code> = variation calendaire sur 1 an, en points pour les taux et en % pour les niveaux de marché.<br>"+
    "<b>Signaux avancés</b> = indicateurs qui précèdent le cycle (pente de courbe, M1 réel, M3, "+
    "anticipations d'emploi). Le PMI étant propriétaire, on utilise l'ESI (Commission/Eurostat).<br>"+
    "<span class='muted'>Sources publiques BCE + Eurostat · CISS © BCE · récessions CEPR-EABCN.</span>"+
    "</div></details>";

  // ---------- ALERTES ----------
  html += "<section class='alert-card'><div class='sec'><span class='ic' aria-hidden='true'>//</span><h2 class='nm'>Signaux d'alerte</h2><span class='ln'></span></div>";
  if(S.alerts && S.alerts.length){
    html += "<div class='alerts'>";
    S.alerts.forEach(a=>{
      const color = statusColor(a.status);
      html += "<div class='al' style='--c:"+color+"'><span class='status-dot' style='background:"+color+"' aria-hidden='true'></span>"+
        "<span class='an'>"+esc(a.name)+"</span>"+
        "<span class='av' style='color:"+color+"'>"+fmt(a.value)+" · z"+sgn(a.z)+"</span></div>";
    });
    html += "</div>";
  } else {
    html += "<div class='ok-banner'>✓ Aucun signal d'alerte : tous les indicateurs sont dans leur zone normale.</div>";
  }
  html += "</section>";

  // ---------- HISTORIQUE ----------
  html += "<details><summary>Score composite historique vs récessions (CEPR)</summary><div class='body'>"+
          "<div class='chart-shell'>"+histChart()+"</div><div class='muted'>Zones rouges = récessions CEPR. Un score &gt;55 avant/pendant "+
          "ces zones fournit une lecture rétrospective, pas une validation prospective.</div></div></details>";

  // ---------- FAMILLES ----------
  S.families.forEach(f=>{
    const familyColor = scoreColor(f.score);
    html += "<section class='family-card'><div class='sec'><span class='ic' aria-hidden='true'>//</span><h2 class='nm'>"+esc(f.label)+
      "</h2><span class='ln'></span><span class='bd' style='background:"+familyColor+"22;color:"+familyColor+
      "'>"+fmt(f.score)+"</span></div><div class='grid'>";
    f.indicators.forEach(d=>{
      const tileColor = statusColor(d.status);
      let mt = (d.z!==null? "<b style='color:"+tileColor+"'>z "+sgn(d.z)+"</b>":"");
      if(d.mom_1y!==null) mt += " · 1A "+sgn(d.mom_1y,1)+esc(d.mom_unit||'');
      html += "<div class='tile' style='--c:"+tileColor+"'>"+
        "<div class='nm'><span class='d'></span>"+esc(d.name)+"</div>"+
        "<div class='vl'>"+fmt(d.value)+(d.unit?"<u>"+esc(d.unit)+"</u>":"")+"</div>"+
        "<div class='mt'>"+mt+"</div>"+
        sparkSVG(d.spark,tileColor)+
        "<div class='asof'><span>au "+esc(d.as_of||'n/a')+"</span><a href='"+esc(d.source_url||'#')+"' target='_blank' rel='noopener'>source</a></div></div>";
    });
    html += "</div></section>";
  });

  // ---------- DIAGNOSTIC ----------
  let diag = "<b>Indicateurs actifs :</b> "+c.total+" affichés sur "+
    ((S.quality&&S.quality.expected)||S.catalog_total)+" attendus<br>"+
    "<b>Périmètre :</b> "+esc(S.scope||'n/a')+"<br>"+
    "<b>Révision source :</b> <code>"+esc(S.source_sha||'n/a')+"</code><br>";
  const errs = S.errors||{};
  const errSources = S.error_sources||{};
  const ek = Object.keys(errs);
  if(ek.length){ diag += "<b>Séries ignorées :</b><br>"; ek.forEach(k=>diag+="• <code>"+esc(k)+"</code> : "+esc(errs[k])+
    (errSources[k]?" · <a href='"+esc(errSources[k])+"' target='_blank' rel='noopener'>source</a>":"")+"<br>"); }
  else { diag += "<span style='color:#5eead4'>Toutes les séries du catalogue ont été récupérées.</span><br>"; }
  diag += "<span class='muted'>© European Central Bank (ECB Data Portal), Eurostat &amp; DG ECFIN · CISS © ECB · récessions CEPR-EABCN.</span>";
  html += "<details><summary>Diagnostic des sources</summary><div class='body'>"+diag+"</div></details>";
  html += footer();

  app.innerHTML = html;
  watchFreshness();

  // ---------- helpers ----------
  function sgn(v,dec){ if(v===null||v===undefined) return 'n/a';
    dec = (dec===undefined?2:dec); return (v>=0?'+':'')+v.toFixed(dec); }
  function statusColor(s){ return {ok:'#5eead4',warning:'#f5b13d',danger:'#ff4d87'}[s]||'#8b909b'; }
  function statusLabel(s){ return {ok:'Normal',warning:'Tension',danger:'Alerte'}[s]||'Indisponible'; }
  function scoreColor(score){
    if(score === null || score === undefined || Number.isNaN(score)) return '#8b909b';
    if(score >= 70) return '#ff4d87';
    if(score >= 55) return '#f5b13d';
    if(score >= 45) return '#8b909b';
    return '#5eead4';
  }
  function histChart(){
    const H=S.history; if(!H||H.length<12) return "<span class='muted'>Historique insuffisant.</span>";
    const W=1000,Ht=240,pad=4;
    const ym = H.map(p=>p[0]);
    const idxOf = d => { const k=d.slice(0,7); let b=0,bd=1e9;
      ym.forEach((m,i)=>{const diff=Math.abs(monthNum(m)-monthNum(k)); if(diff<bd){bd=diff;b=i;}}); return b; };
    const x = i => pad + (i/(H.length-1))*(W-2*pad);
    const y = v => Ht-pad - (v/100)*(Ht-2*pad);
    let svg = "<svg viewBox='0 0 "+W+" "+Ht+"' preserveAspectRatio='none' style='width:100%;height:auto;background:var(--panel);border-radius:6px' role='img' aria-label='Historique du score composite et périodes de récession CEPR'>";
    // recession bands
    (S.recessions||[]).forEach(p=>{
      const x0=x(idxOf(p[0])), x1=x(idxOf(p[1]));
      svg += "<rect x='"+x0.toFixed(1)+"' y='0' width='"+Math.max(1,(x1-x0)).toFixed(1)+"' height='"+Ht+"' fill='#ff4d87' opacity='0.15'/>";
    });
    // threshold 55
    svg += "<line x1='0' y1='"+y(55).toFixed(1)+"' x2='"+W+"' y2='"+y(55).toFixed(1)+"' stroke='#666' stroke-width='1' stroke-dasharray='4 4'/>";
    // line
    const pts = H.map((p,i)=> x(i).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ');
    svg += "<polyline fill='none' stroke='#5eead4' stroke-width='2' points='"+pts+"'/>";
    svg += "</svg>";
    return svg;
  }
  function monthNum(ym){ const a=ym.split('-'); return parseInt(a[0])*12+parseInt(a[1]||1); }
})();
</script>
</body>
</html>
