<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Euro Macro Risk</title>
<style>
  :root{
    --bg:#1a1a1a; --panel:#202020; --panel2:#171717;
    --line:rgba(0,240,208,.16); --line-soft:rgba(255,255,255,.10);
    --txt:#b8fff5; --paper:#e7e9ee; --bright:#f5f6f8;
    --mut:#6f9b94; --faint:#456b65; --accent:#00f0d0; --teal:#5eead4;
    --yen:#ff6b9d; --rose:#ff4d87; --gold:#f5b13d; --orange:#ff8a3d;
    --ok:#5eead4; --warn:#f5b13d; --dang:#ff4d87;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{background:radial-gradient(1100px 520px at 50% -8%,rgba(94,234,212,.05),transparent 62%),var(--bg);
    color:var(--txt);margin:0;padding:20px 28px 40px;font-family:var(--mono);max-width:1220px;margin:0 auto;}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.08) 3px);
    mix-blend-mode:multiply;opacity:.42;}
  a{color:var(--teal);}
  .tape{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px 22px;border-bottom:1px solid var(--line);
    padding-bottom:14px;margin-bottom:20px;}
  .brand{color:var(--bright);font-size:1.15rem;font-weight:800;}
  .brand b{color:var(--yen);}
  .tagline{color:var(--mut);font-size:.72rem;letter-spacing:.03em;}
  .top-nav{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center;}
  .nav-link{color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:4px 10px;
    font-size:.7rem;text-decoration:none;}
  .nav-link:hover,.nav-link.active{color:var(--bright);border-color:rgba(94,234,212,.65);
    background:rgba(94,234,212,.06);}
  .status-pill{color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:4px 10px;
    font-size:.7rem;display:flex;gap:8px;align-items:center;}
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}
  .title{font-size:24px;font-weight:800;margin:0;color:var(--bright);border-bottom:1px solid var(--line);
    padding-bottom:8px;text-shadow:0 0 30px rgba(94,234,212,.18);}
  .sub{color:var(--mut);font-size:12px;margin-top:9px;line-height:1.5;}
  .hero{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:18px 0 16px;}
  .stat{background:var(--panel);border:0;border-left:3px solid var(--accent);border-radius:0;padding:15px 16px;min-height:112px;}
  .stat .lab{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;}
  .stat .big{font-size:34px;font-weight:800;font-family:ui-monospace,'SF Mono',monospace;line-height:1.1;margin-top:2px;}
  .stat .big small{font-size:14px;color:var(--mut);font-weight:600;}
  .pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;margin-top:6px;}
  .dots{font-size:13px;font-family:ui-monospace,'SF Mono',monospace;margin-top:10px;color:var(--mut);}
  details{background:rgba(255,255,255,.018);border:1px solid var(--line);border-radius:10px;padding:0 14px;margin:10px 0;}
  details summary{cursor:pointer;padding:11px 0;font-size:13px;font-weight:600;color:var(--paper);list-style:none;}
  details summary::-webkit-details-marker{display:none;}
  details summary::before{content:'▸ ';color:var(--mut);}
  details[open] summary::before{content:'▾ ';}
  details .body{padding:4px 0 14px;font-size:12.5px;line-height:1.6;color:var(--mut);}
  .sec{display:flex;align-items:center;gap:10px;margin:20px 0 10px;}
  .sec .ic{font-size:13px;color:var(--yen);}
  .sec .nm{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;}
  .sec .ln{flex:1;height:1px;background:var(--line);}
  .sec .bd{font-family:ui-monospace,'SF Mono',monospace;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:9px;}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 13px 9px;position:relative;overflow:hidden;transition:.15s;}
  .tile:hover{border-color:rgba(94,234,212,.65);background:var(--panel2);}
  .tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);}
  .tile .nm{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;line-height:1.25;min-height:25px;display:flex;gap:5px;}
  .tile .nm .d{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none;margin-top:3px;}
  .tile .vl{font-size:21px;font-weight:700;font-family:ui-monospace,'SF Mono',monospace;color:var(--bright);line-height:1.1;margin-top:5px;}
  .tile .vl u{font-size:11px;color:var(--mut);font-weight:600;text-decoration:none;margin-left:3px;}
  .tile .mt{font-size:10px;font-family:ui-monospace,'SF Mono',monospace;color:var(--mut);margin-top:4px;}
  .tile .mt b{font-weight:700;}
  .tile svg.spark{display:block;width:100%;height:26px;margin-top:6px;}
  .alerts{display:flex;flex-wrap:wrap;gap:7px;}
  .al{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:7px 11px;}
  .al .an{font-size:11px;color:var(--paper);font-weight:600;}
  .al .av{font-family:ui-monospace,'SF Mono',monospace;font-size:12px;font-weight:700;}
  .muted{color:var(--mut);font-size:11px;}
  .ok-banner{background:rgba(94,234,212,.06);border:1px solid var(--line);color:var(--teal);border-radius:8px;padding:10px 14px;font-size:13px;}
  .help-card{background:rgba(255,255,255,.018);border:1px solid var(--line);border-left:2px solid var(--teal);
    border-radius:8px;padding:13px 15px;color:var(--mut);font-size:.82rem;line-height:1.55;margin:8px 0 14px;}
  .help-card strong{color:var(--paper);}
  .faq-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:10px 0 18px;}
  .faq-card{background:rgba(255,255,255,.018);border:1px solid var(--line);border-radius:8px;
    padding:14px 15px;min-height:128px;color:var(--mut);font-size:.82rem;line-height:1.52;}
  .faq-card strong{color:var(--paper);display:block;margin-bottom:6px;}
  .site-footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
    margin-top:34px;padding:18px 0 6px;border-top:1px solid var(--line);color:var(--faint);font-size:.72rem;}
  .l0g-logo{display:inline-flex;align-items:baseline;gap:2px;color:var(--bright);font-weight:800;text-decoration:none;letter-spacing:0;}
  .l0g-logo .slash{color:var(--teal);}
  .l0g-logo:hover{color:var(--teal);}
  .chart-shell svg{border:1px solid var(--line);}
  @media (max-width:640px){
    body{padding:16px 14px 30px;}
    .title{font-size:20px;}
    .stat .big{font-size:28px;}
    .hero,.faq-grid{grid-template-columns:1fr;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;}
    .top-nav{margin-left:0;}
  }
</style>
</head>
<body>
<div id="app"><p class="muted">Chargement de l'instantané…</p></div>

<script src="snapshot.js"></script>
<script>
(function(){
  const S = window.SNAPSHOT;
  const app = document.getElementById('app');
  if(!S){ app.innerHTML = "<p class='muted'>Aucun instantané trouvé. Lancez "+
    "<code>python build_snapshot.py</code> pour générer <code>snapshot.js</code>.</p>"; return; }

  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  function fmt(v){
    if(v===null||v===undefined) return 'n/a';
    const a=Math.abs(v);
    if(a>=1000) return v.toLocaleString('fr-FR',{maximumFractionDigits:0});
    if(a>=1)    return v.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
    return v.toLocaleString('fr-FR',{minimumFractionDigits:3,maximumFractionDigits:3});
  }
  const emoji = {ok:'🟢',warning:'🟡',danger:'🔴',unknown:'⚪'};
  const params = new URLSearchParams(window.location.search);
  const view = ['faq','help','aide'].includes((params.get('view')||'').toLowerCase()) ? 'faq' : 'radar';

  function header(){
    const radar = view === 'radar' ? 'active' : '';
    const faq = view === 'faq' ? 'active' : '';
    return "<header class='tape'>"+
      "<div class='brand'><b>Euro</b> Macro <b>Risk</b></div>"+
      "<div class='tagline'>Zone euro EA20 · BCE · Eurostat · cycle · stress macro</div>"+
      "<nav class='top-nav' aria-label='Navigation'>"+
        "<a class='nav-link "+radar+"' href='?'>Radar</a>"+
        "<a class='nav-link "+faq+"' href='?view=faq'>Aide / FAQ</a>"+
      "</nav>"+
      "<div class='status-pill'><span class='status-dot'></span>"+esc(S.generated_at)+"</div>"+
    "</header>";
  }

  function footer(){
    return "<div class='site-footer'>"+
      "<a class='l0g-logo' href='https://l0g.fr' target='_blank' rel='noopener' aria-label='l0g.fr'>"+
        "<span class='slash'>//</span><span>l0g.fr</span></a>"+
      "<span>Euro Macro Risk · MIT License</span>"+
    "</div>";
  }

  function faqPage(){
    return header()+
      "<div class='title'>Aide / FAQ</div>"+
      "<div class='help-card'><strong>Objectif.</strong> Euro Macro Risk agrège des séries publiques BCE et Eurostat pour surveiller le régime macro de la zone euro. L'outil ne prédit pas une récession et ne donne pas de conseil d'investissement : il aide à savoir quels canaux lire en premier.</div>"+
      "<div class='faq-grid'>"+
        "<div class='faq-card'><strong>Périmètre</strong> Le dashboard suit la zone euro, principalement EA20, avec des séries monétaires, souveraines, inflation, emploi, crédit, activité, corporate et immobilier.</div>"+
        "<div class='faq-card'><strong>Score 0-100</strong> Le score combine les indicateurs disponibles, pondérés par leur pouvoir prédictif historique face aux récessions CEPR. Plus le score monte, plus le régime est tendu.</div>"+
        "<div class='faq-card'><strong>Sources</strong> Les données viennent de sources publiques et gratuites : ECB Data Portal, Eurostat et datation CEPR-EABCN pour les récessions de la zone euro.</div>"+
        "<div class='faq-card'><strong>Lecture</strong> Le score global compte moins que sa composition : il faut regarder si la tension vient des taux, du souverain, du crédit, de l'activité réelle ou du stress systémique.</div>"+
      "</div>"+
      "<details open><summary>Que mesure exactement le radar ?</summary><div class='body'>Chaque série est comparée à son régime récent via un z-score orienté risque. Une valeur élevée n'est pas toujours un risque : certaines séries deviennent risquées quand elles baissent, comme la pente de courbe ou la monnaie réelle.</div></details>"+
      "<details><summary>Pourquoi remplacer le PMI ?</summary><div class='body'>Le PMI est propriétaire. Le dashboard utilise donc l'ESI et d'autres séries Eurostat ou BCE qui sont publiques, vérifiables et réutilisables sans clé.</div></details>"+
      "<details><summary>Comment lire les couleurs ?</summary><div class='body'>Vert signifie zone normale, jaune tension et rouge alerte, selon l'écart à la moyenne mobile 5 ans dans le sens du risque. La couleur est un signal de tri, pas une conclusion macro définitive.</div></details>"+
      "<details><summary>Quelles limites garder en tête ?</summary><div class='body'>Certaines séries sont révisées, publiées avec retard ou indisponibles temporairement. Le diagnostic liste les séries ignorées afin de garder une lecture transparente.</div></details>"+
      footer();
  }

  if(view === 'faq'){
    app.innerHTML = faqPage();
    return;
  }

  function sparkSVG(arr,color){
    if(!arr||arr.length<2) return '';
    const w=100,h=26,n=arr.length;
    const mn=Math.min(...arr),mx=Math.max(...arr),rg=(mx-mn)||1;
    const pts=arr.map((v,i)=>{
      const x=(i/(n-1))*w, y=h-2-((v-mn)/rg)*(h-4);
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    return "<svg class='spark' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none'>"+
      "<polyline fill='none' stroke='"+color+"' stroke-width='1.5' points='"+pts+"'/></svg>";
  }

  // ---------- HERO ----------
  const c=S.counts, r=S.regime;
  const regimeColor = scoreColor(S.global_score);
  let html = header()+
    "<div class='title'>Euro Macro Risk</div>"+
    "<div class='sub'>BCE + Eurostat · "+c.total+" indicateurs · MAJ "+esc(S.generated_at)+
      " · backtest récessions CEPR</div>"+
    "<div class='hero'>"+
      "<div class='stat' style='border-left-color:"+regimeColor+"'><div class='lab'>Score de risque global</div>"+
        "<div class='big' style='color:"+regimeColor+"'>"+fmt(S.global_score)+"<small>/100</small></div></div>"+
      "<div class='stat' style='border-left-color:"+regimeColor+"'><div class='lab'>Régime macro</div>"+
        "<span class='pill' style='background:"+regimeColor+"22;color:"+regimeColor+";border:1px solid "+regimeColor+"55'>"+
        esc(r.label)+"</span></div>"+
      "<div class='stat' style='border-left-color:"+(S.ciss?statusColor(S.ciss.status):'var(--faint)')+"'><div class='lab'>CISS · stress systémique BCE</div>"+
        (S.ciss?("<div class='big' style='color:"+statusColor(S.ciss.status)+"'>"+fmt(S.ciss.value)+" "+emoji[S.ciss.status]+"</div>"):"<div class='muted'>n/d</div>")+"</div>"+
      "<div class='stat' style='border-left-color:var(--teal)'><div class='lab'>État des "+c.total+" indicateurs</div>"+
        "<div class='dots'>🟢 "+c.ok+"&nbsp;&nbsp;🟡 "+c.warn+"&nbsp;&nbsp;🔴 "+c.dang+"</div></div>"+
    "</div>";

  // ---------- LÉGENDE ----------
  html +=
    "<details><summary>ℹ️ Comment lire ce tableau de bord</summary><div class='body'>"+
    "<b>Score global 0-100</b> : agrégation pondérée par pouvoir prédictif (corrélation historique "+
    "aux récessions CEPR). 🟩 &lt;45 Risk-On · ⬜ 45-55 Neutre · 🟧 55-70 Prudence · 🟥 &gt;70 Stress.<br>"+
    "<b>Couleur d'un indicateur</b> = z-score signé (écart à sa moyenne 5 ans, orienté risque) : "+
    "🟢 normal · 🟡 tension (|z|≥1) · 🔴 alerte (|z|≥2). <code>z</code> = z-score · <code>1A</code> = variation sur 1 an.<br>"+
    "<b>Signaux avancés</b> = indicateurs qui précèdent le cycle (pente de courbe, M1 réel, M3, "+
    "anticipations d'emploi). Le PMI étant propriétaire, on utilise l'ESI (Commission/Eurostat).<br>"+
    "<span class='muted'>Sources publiques BCE + Eurostat · CISS © BCE · récessions CEPR-EABCN.</span>"+
    "</div></details>";

  // ---------- ALERTES ----------
  html += "<div class='sec'><span class='ic'>⚠️</span><span class='nm'>Signaux d'alerte</span><span class='ln'></span></div>";
  if(S.alerts && S.alerts.length){
    html += "<div class='alerts'>";
    S.alerts.forEach(a=>{
      const color = statusColor(a.status);
      html += "<div class='al' style='--c:"+color+"'>"+emoji[a.status]+
        "<span class='an'>"+esc(a.name)+"</span>"+
        "<span class='av' style='color:"+color+"'>"+fmt(a.value)+" · z"+sgn(a.z)+"</span></div>";
    });
    html += "</div>";
  } else {
    html += "<div class='ok-banner'>✓ Aucun signal d'alerte : tous les indicateurs sont dans leur zone normale.</div>";
  }

  // ---------- HISTORIQUE ----------
  html += "<details><summary>📈 Score composite historique vs récessions (CEPR)</summary><div class='body'>"+
          "<div class='chart-shell'>"+histChart()+"</div><div class='muted'>Zones rouges = récessions CEPR. Un score &gt;55 avant/pendant "+
          "ces zones valide le pouvoir d'alerte du composite.</div></div></details>";

  // ---------- FAMILLES ----------
  S.families.forEach(f=>{
    const familyColor = scoreColor(f.score);
    html += "<div class='sec'><span class='ic'>"+f.icon+"</span><span class='nm'>"+esc(f.label)+
      "</span><span class='ln'></span><span class='bd' style='background:"+familyColor+"22;color:"+familyColor+
      "'>"+fmt(f.score)+"</span></div><div class='grid'>";
    f.indicators.forEach(d=>{
      const tileColor = statusColor(d.status);
      let mt = (d.z!==null? "<b style='color:"+tileColor+"'>z "+sgn(d.z)+"</b>":"");
      if(d.mom_1y!==null) mt += " · 1A "+sgn(d.mom_1y,0)+"%";
      html += "<div class='tile' style='--c:"+tileColor+"'>"+
        "<div class='nm'><span class='d'></span>"+esc(d.name)+"</div>"+
        "<div class='vl'>"+fmt(d.value)+(d.unit?"<u>"+esc(d.unit)+"</u>":"")+"</div>"+
        "<div class='mt'>"+mt+"</div>"+
        sparkSVG(d.spark,tileColor)+"</div>";
    });
    html += "</div>";
  });

  // ---------- DIAGNOSTIC ----------
  let diag = "<b>Indicateurs actifs :</b> "+c.total+" affichés ("+S.catalog_total+" au catalogue)<br>";
  const errs = S.errors||{};
  const ek = Object.keys(errs);
  if(ek.length){ diag += "<b>Séries ignorées :</b><br>"; ek.forEach(k=>diag+="• <code>"+esc(k)+"</code> : "+esc(errs[k])+"<br>"); }
  else { diag += "<span style='color:#5eead4'>Toutes les séries du catalogue ont été récupérées.</span><br>"; }
  diag += "<span class='muted'>© European Central Bank (ECB Data Portal) &amp; Eurostat · CISS © ECB · récessions CEPR-EABCN.</span>";
  html += "<details><summary>⚙️ Diagnostic des sources</summary><div class='body'>"+diag+"</div></details>";
  html += footer();

  app.innerHTML = html;

  // ---------- helpers ----------
  function sgn(v,dec){ if(v===null||v===undefined) return 'n/a';
    dec = (dec===undefined?2:dec); return (v>=0?'+':'')+v.toFixed(dec); }
  function statusColor(s){ return {ok:'#5eead4',warning:'#f5b13d',danger:'#ff4d87'}[s]||'#456b65'; }
  function scoreColor(score){
    if(score === null || score === undefined || Number.isNaN(score)) return '#456b65';
    if(score >= 70) return '#ff4d87';
    if(score >= 55) return '#f5b13d';
    if(score >= 45) return '#6f9b94';
    return '#5eead4';
  }
  function histChart(){
    const H=S.history; if(!H||H.length<12) return "<span class='muted'>Historique insuffisant.</span>";
    const W=1000,Ht=240,pad=4;
    const ym = H.map(p=>p[0]);
    const idxOf = d => { const k=d.slice(0,7); let b=0,bd=1e9;
      ym.forEach((m,i)=>{const diff=Math.abs(monthNum(m)-monthNum(k)); if(diff<bd){bd=diff;b=i;}}); return b; };
    const x = i => pad + (i/(H.length-1))*(W-2*pad);
    const y = v => Ht-pad - (v/100)*(Ht-2*pad);
    let svg = "<svg viewBox='0 0 "+W+" "+Ht+"' preserveAspectRatio='none' style='width:100%;height:240px;background:#1a1a1a;border-radius:8px'>";
    // recession bands
    (S.recessions||[]).forEach(p=>{
      const x0=x(idxOf(p[0])), x1=x(idxOf(p[1]));
      svg += "<rect x='"+x0.toFixed(1)+"' y='0' width='"+Math.max(1,(x1-x0)).toFixed(1)+"' height='"+Ht+"' fill='#ff4d87' opacity='0.15'/>";
    });
    // threshold 55
    svg += "<line x1='0' y1='"+y(55).toFixed(1)+"' x2='"+W+"' y2='"+y(55).toFixed(1)+"' stroke='#666' stroke-width='1' stroke-dasharray='4 4'/>";
    // line
    const pts = H.map((p,i)=> x(i).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ');
    svg += "<polyline fill='none' stroke='#5eead4' stroke-width='2' points='"+pts+"'/>";
    svg += "</svg>";
    return svg;
  }
  function monthNum(ym){ const a=ym.split('-'); return parseInt(a[0])*12+parseInt(a[1]||1); }
})();
</script>
</body>
</html>
